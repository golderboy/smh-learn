log_format smh_metrics escape=json '{"status":$status,"method":"$request_method","duration_seconds":$request_time,"upstream_seconds":"$upstream_response_time"}';
access_log /var/log/nginx/access.log smh_metrics;
map $uri $smh_referrer_policy {
    default strict-origin-when-cross-origin;
    ~^/(login|auth/thaid) no-referrer;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 110M;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy $smh_referrer_policy always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/build/assets/[^/]+\.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location /_protected_media/ {
        internal;
        alias /var/www/html/storage/app/private/learning/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass app:9000;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
