log_format smh_metrics escape=json '{"status":$status,"method":"$request_method","duration_seconds":$request_time}';
access_log /var/log/nginx/access.log smh_metrics;
# Do not write request paths/query strings containing coupon codes or OAuth codes.
error_log /var/log/nginx/error.log crit;
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 110M;
    # Docker service addresses may change when only the PHP image is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/build/assets/[^/]+\.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    location /_protected_media/ {
        internal;
        alias /var/www/html/storage/app/private/learning/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        # Only a host HTTPS proxy may access this loopback-only production backend.
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        # The host proxy replaces this header with a single client address.
        fastcgi_param REMOTE_ADDR $http_x_forwarded_for;
        set $php_backend app:9000;
        fastcgi_pass $php_backend;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
