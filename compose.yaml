name: smh-learning-dev

x-php: &php
  image: smh-learning-php:dev
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
    - php-vendor:/var/www/html/vendor
  init: true

services:
  app:
    <<: *php
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/up]
      interval: 10s
      timeout: 5s
      retries: 5

  mariadb:
    image: mariadb:11.8@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
    environment:
      MARIADB_DATABASE: smh_learning_dev
      MARIADB_USER: smh_dev
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run scripts/setup-dev.ps1 first}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Run scripts/setup-dev.ps1 first}
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-33068}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

  queue-worker:
    <<: *php
    command: [php, artisan, queue:work, redis, --sleep=1, --tries=3, --timeout=180]
    depends_on:
      app:
        condition: service_healthy
    stop_grace_period: 200s

  scheduler:
    <<: *php
    command: [php, artisan, schedule:work]
    depends_on:
      app:
        condition: service_healthy

volumes:
  mariadb-data:
  redis-data:
  php-vendor:
